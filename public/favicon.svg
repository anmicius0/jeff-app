<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Dark Obsidian Base (Squircle) -->
  <rect width="512" height="512" rx="115" fill="#0b0b0c" />

  <!-- Flat Translucent Liquid Glass Shield (Increased Safe Space Margin) -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="#18181b" stroke="#27272a" stroke-width="2" />

  <!-- Top Glass Frosted Specular Sheen -->
  <path d="M 50 120 C 50 82 82 50 120 50 L 392 50 C 430 50 462 82 462 120 C 462 180 375 210 256 210 C 137 210 50 180 50 120 Z" fill="#ffffff" fill-opacity="0.04" />

  <!-- Flat Dumbbell Emblem (Scaled into Safe Zone) -->
  <g>
    <!-- Grip Bar -->
    <rect x="190" y="222" width="132" height="20" rx="10" fill="#ffffff" />
    
    <!-- Grip Rings -->
    <line x1="215" y1="222" x2="215" y2="242" stroke="#18181b" stroke-width="2" />
    <line x1="235" y1="222" x2="235" y2="242" stroke="#18181b" stroke-width="2" />
    <line x1="256" y1="222" x2="256" y2="242" stroke="#18181b" stroke-width="2" />
    <line x1="277" y1="222" x2="277" y2="242" stroke="#18181b" stroke-width="2" />
    <line x1="297" y1="222" x2="297" y2="242" stroke="#18181b" stroke-width="2" />

    <!-- Inner Collars -->
    <rect x="175" y="212" width="15" height="40" rx="7" fill="#ffffff" />
    <rect x="322" y="212" width="15" height="40" rx="7" fill="#ffffff" />

    <!-- Large Inner Plates (Left & Right) -->
    <rect x="140" y="160" width="34" height="144" rx="17" fill="#ffffff" />
    <rect x="338" y="160" width="34" height="144" rx="17" fill="#ffffff" />

    <!-- Middle Plates (Left & Right) -->
    <rect x="105" y="185" width="34" height="94" rx="17" fill="#ffffff" />
    <rect x="373" y="185" width="34" height="94" rx="17" fill="#ffffff" />

    <!-- Outer Hex Caps -->
    <rect x="88" y="220" width="16" height="24" rx="8" fill="#ffffff" />
    <rect x="408" y="220" width="16" height="24" rx="8" fill="#ffffff" />
  </g>

  <!-- Typography: JEFF APP -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="38" font-weight="800" letter-spacing="4" fill="#ffffff" text-anchor="middle">JEFF APP</text>
</svg>
