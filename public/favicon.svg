<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Mono Black Base (Squircle) -->
  <rect width="512" height="512" rx="115" fill="#000000" />

  <!-- Flat Dumbbell Emblem (Solid High-Contrast White) -->
  <g>
    <!-- Grip Bar -->
    <rect x="185" y="222" width="142" height="18" rx="9" fill="#ffffff" />
    
    <!-- Grip Rings -->
    <line x1="210" y1="222" x2="210" y2="240" stroke="#000000" stroke-width="2" />
    <line x1="230" y1="222" x2="230" y2="240" stroke="#000000" stroke-width="2" />
    <line x1="256" y1="222" x2="256" y2="240" stroke="#000000" stroke-width="2" />
    <line x1="282" y1="222" x2="282" y2="240" stroke="#000000" stroke-width="2" />
    <line x1="302" y1="222" x2="302" y2="240" stroke="#000000" stroke-width="2" />

    <!-- Inner Collars -->
    <rect x="172" y="212" width="14" height="38" rx="7" fill="#ffffff" />
    <rect x="326" y="212" width="14" height="38" rx="7" fill="#ffffff" />

    <!-- Large Inner Plates (Left & Right) -->
    <rect x="138" y="160" width="34" height="142" rx="17" fill="#ffffff" />
    <rect x="340" y="160" width="34" height="142" rx="17" fill="#ffffff" />

    <!-- Middle Plates (Left & Right) -->
    <rect x="105" y="185" width="33" height="92" rx="16" fill="#ffffff" />
    <rect x="374" y="185" width="33" height="92" rx="16" fill="#ffffff" />

    <!-- Outer Hex Caps -->
    <rect x="88" y="220" width="17" height="22" rx="8" fill="#ffffff" />
    <rect x="407" y="220" width="17" height="22" rx="8" fill="#ffffff" />
  </g>

  <!-- Typography: JEFF APP -->
  <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="38" font-weight="800" letter-spacing="4" fill="#ffffff" text-anchor="middle">JEFF APP</text>
</svg>
