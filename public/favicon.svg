<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Dark Obsidian Base (Squircle) -->
  <rect width="512" height="512" rx="115" fill="#0b0b0c" />

  <!-- Flat Translucent Liquid Glass Shield -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="#18181b" stroke="#27272a" stroke-width="2" />

  <!-- Top Glass Frosted Specular Sheen (Subtle solid opacity) -->
  <path d="M 38 126 C 38 78 78 38 126 38 L 386 38 C 434 38 474 78 474 126 C 474 195 380 230 256 230 C 132 230 38 195 38 126 Z" fill="#ffffff" fill-opacity="0.04" />

  <!-- Flat Dumbbell Emblem (Solid High-Contrast White & Greys) -->
  <g>
    <!-- Grip Bar -->
    <rect x="180" y="238" width="152" height="24" rx="12" fill="#ffffff" />
    
    <!-- Grip Rings (Subtle insets) -->
    <line x1="210" y1="238" x2="210" y2="262" stroke="#18181b" stroke-width="2" />
    <line x1="230" y1="238" x2="230" y2="262" stroke="#18181b" stroke-width="2" />
    <line x1="256" y1="238" x2="256" y2="262" stroke="#18181b" stroke-width="2" />
    <line x1="282" y1="238" x2="282" y2="262" stroke="#18181b" stroke-width="2" />
    <line x1="302" y1="238" x2="302" y2="262" stroke="#18181b" stroke-width="2" />

    <!-- Inner Collars -->
    <rect x="162" y="226" width="18" height="48" rx="9" fill="#ffffff" />
    <rect x="332" y="226" width="18" height="48" rx="9" fill="#ffffff" />

    <!-- Large Inner Plates (Left & Right) -->
    <rect x="122" y="165" width="40" height="170" rx="20" fill="#ffffff" />
    <rect x="350" y="165" width="40" height="170" rx="20" fill="#ffffff" />

    <!-- Middle Plates (Left & Right) -->
    <rect x="82" y="195" width="40" height="110" rx="20" fill="#ffffff" />
    <rect x="390" y="195" width="40" height="110" rx="20" fill="#ffffff" />

    <!-- Outer Hex Caps -->
    <rect x="62" y="235" width="20" height="30" rx="10" fill="#ffffff" />
    <rect x="430" y="235" width="20" height="30" rx="10" fill="#ffffff" />
  </g>

  <!-- Typography: JEFF APP -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="46" font-weight="800" letter-spacing="4" fill="#ffffff" text-anchor="middle">JEFF APP</text>
</svg>
